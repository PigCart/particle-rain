name: release

on:
  release:
    types: [published]

jobs:
  parse-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.parse.outputs.resultArray }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: read mod properties toml
        uses: juliangruber/read-file-action@v1
        id: toml
        with:
          path: stonecutter.properties.toml
      - name: parse versions
        id: parse
        uses: tmelliottjr/extract-regex-action@v1.5.0
        with:
          regex: '(?<=\[").*(?="]\n)'
          input: ${{ steps.toml.outputs.content }}
          flags: g
  release:
    runs-on: ubuntu-latest
    needs: parse-versions
    strategy:
      matrix:
        version: ${{ fromJSON(needs.parse-versions.outputs.versions) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3
      - uses: burrunan/gradle-cache-action@v1
        with:
          gradle-distribution-sha-256-sum-warning: false
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: 25
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew ${{ matrix.version }}:build --no-daemon
      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: nrikgvxm
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 421897
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/${{ matrix.version }}/build/libs/*.jar
          name: ${{ github.event.release.tag_name }} for ${{ matrix.version }}
          version: ${{ github.event.release.tag_name }}+${{ matrix.version }}