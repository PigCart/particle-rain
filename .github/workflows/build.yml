name: build
on: [pull_request, push]

jobs:
  parse-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.parse.outputs.resultArray }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: read mod properties toml
        uses: juliangruber/read-file-action@v1
        id: toml
        with:
          path: stonecutter.properties.toml
      - name: parse versions
        id: parse
        uses: tmelliottjr/extract-regex-action@v1.5.0
        with:
          regex: '(?<=\[").*(?="]\n)'
          input: ${{ steps.toml.outputs.content }}
          flags: g
  build:
    runs-on: ubuntu-latest
    needs: parse-versions
    strategy:
      matrix:
        version: ${{ fromJSON(needs.parse-versions.outputs.versions) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: 25
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew ${{ matrix.version }}:build --no-daemon
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar